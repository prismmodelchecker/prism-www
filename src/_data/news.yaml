- date: 2012-09
  text: >-
    Interested in probabilistic model checking for probabilistic timed automata? A new
    [tutorial paper](/bibitem/NPS13/) is now available, to appear in
    [Formal Methods in System Design](http://www.springer.com/engineering/circuits+%26+systems/journal/10703).

- date: 2012-09
  text: >-
    Nature Scientific Reports publish a
    [paper](http://www.nature.com/srep/2012/120913/srep00656/full/srep00656.html) by Luca Cardelli & Attila
    Csikász-Nagy that uses PRISM to study cell cycle switch as a computing device. [Details](/news/2012-09-nsr/).

- date: 2012-09
  text: >-
    Marta Kwiatkowska will give this year's
    [Milner Lecture](http://wcms.inf.ed.ac.uk/lfcs/events/milner-lectures/), entitled "Sensing everywhere: on
    quantitative verification for ubiquitous computing", at the University of Edinburgh on 25 Sep 2012.

- date: 2012-07
  text: >-
    A postdoctoral position is now available at Birmingham on the forthcoming
    [HIERATIC](http://www.cs.bham.ac.uk/research/projects/hieratic/) project. See the
    [advert](http://www.jobs.ac.uk/job/AEU961/research-fellow/), the
    [particulars](http://www.download.bham.ac.uk/vacancies/jd/43880.pdf) and
    [apply online](https://atsv7.wcn.co.uk/search_engine/jobs.cgi?SID=amNvZGU9MTI2MTE5NyZ2dF90ZW1wbGF0ZT03Njcmb3duZXI9NTAzMjUyMSZvd25lcnR5cGU9ZmFpciZicmFuZF9pZD0wJnZhY2Zpcm0udmFjdGl0bGU9aGllcmF0aWMmcG9zdGluZ19jb2RlPTExNyZyZXFzaWc9MTM0MjYyNjg3Ny04YTYzNTgwYjM2NTkwZTcyYTc4YTA0ZDRlZjhlNTgxY2E2Yjc0NTNj).
    Applications close 14 Aug 2012.

- date: 2012-04
  text: >-
    Two postdoctoral positions are now available at Oxford on the [VERIWARE](http://www.veriware.org/) and
    [Autonomous Ubiquitous Sensing](http://qav.cs.ox.ac.uk/projects/sensing/) projects. Applications close 25
    April 2012. Details: [position 1](http://www.cs.ox.ac.uk/news/474-full.html) and
    [position 2](http://www.cs.ox.ac.uk/news/475-full.html).

- date: 2012-02
  text: >-
    We are pleased to announce the release of [PRISM-games](/games/), a new extension of PRISM for model checking
    [stochastic multi-player games](/bibitem/CFK+12/).

- date: 2012-02
  text: >-
    PRISM has now been [downloaded](/download/) more than 25,000 times. Thanks for your support.

- date: 2010-08
  text: >-
    Marta Kwiatkowska will give a course on "Advances in Probabilistic Model Checking" at the
    [Marktoberdorf 2011](http://asimod.in.tum.de/2011/) summer-school this month. See
    [this page](/courses/marktoberdorf11/) for resources.

- date: 2011-07
  text: >-
    To coincide with the recent [release](/download/) of [PRISM 4.0](/bibitem/KNP11/), we are pleased to announce
    the new [PRISM benchmark suite](/benchmarks/), for testing or evaluating probabilistic model checking tools
    and techniques.

- date: 2011-07
  text: >-
    Congratulations to Shinji Kikuchi and Yasuhide Matsumoto from [Fujitsu](http://jp.fujitsu.com/group/labs/en/),
    who won the Best Paper award for their new [paper](/bibitem/KM11/) applying PRISM to cloud computing systems.

- date: 2011-05
  text: >-
    The final beta release of PRISM 4.0, which includes support for probabilistic timed automata (PTAs) and
    statistical model checking, is available on the main [download](/download/) page.

- date: 2011-03
  text: >-
    Interested in probabilistic model checking for MDPs? A new [tutorial paper](/bibitem/FKNP11/) on the subject,
    written for the [SFM-11:CONNECT](http://www.sti.uniurb.it/events/sfm11connect/) summer-school, is now
    available.

- date: 2011-02
  text: >-
    A fully funded PhD studentship is now available at Oxford on the topic "Automated Verification Techniques for
    DNA Computing". Applications close 28 Feb 2011. [More details](http://www.cs.ox.ac.uk/news/304-full.html).

- date: 2010-12
  text: >-
    An early release of PRISM 4.0 is now available as a
    [development version](https://github.com/prismmodelchecker/prism). This includes support for probabilistic
    timed automata (PTAs) and statistical model checking.

- date: 2010-11
  text: >-
    A 1-year postdoc position is now available at Oxford on the
    [PRISMATIC](http://qav.cs.ox.ac.uk/projects/darpa-prismatic/) project. Applications close 8 Dec 2010.
    [More details](http://www.cs.ox.ac.uk/news/278-full.html).

- date: 2010-10
  text: >-
    A fully funded PhD studentship is now available at Oxford on the new [VERIWARE](http://www.veriware.org/)
    project. Applications close 15 Nov 2010. [More details](http://www.cs.ox.ac.uk/news/236-full.html).

- date: 2010-09
  text: >-
    US R&D company [SIFT](http://www.sift.info/) is hiring researchers in probabilistic verification.
    [Details](/news/2010-09-sift/).

- date: 2010-08
  text: >-
    The paper "[Probabilistic Model Checking of Complex Biological Pathways](/bibitem/HKN+08/)", by John Heath,
    Marta Kwiatkowska, Gethin Norman, David Parker and Oksana Tymchyshyn, was recently awarded the Top Cited
    Article award in the journal Theoretical Computer Science, for the period 2005-2010.

- date: 2010-07
  text: >-
    Marta Kwiatkowska and Dave Parker will give a 5-part [course](/lectures/esslli10/) on "Probabilistic Model
    Checking" at the [ESSLLI'10](http://esslli2010cph.info/) summer-school in Copenhagen next month.

- date: 2010-06
  text: >-
    Interested in applying PRISM to systems biology? This new [book chapter](/bibitem/KNP10a/) in "Symbolic
    Systems Biology: Theory and Methods" provides a tutorial and exercises on the subject.

- date: 2010-04
  text: >-
    A 2-year postdoc position is now available at Oxford on the
    [Predictable Software Systems](http://qav.cs.ox.ac.uk/projects/epsrc-pss/) project. Applications close 28 May
    2010. [More details](http://www.cs.ox.ac.uk/news/190-full.html).

- date: 2010-03
  text: >-
    Two postdoctoral positions are now available at Oxford on the forthcoming [VERIWARE](http://www.veriware.org/)
    project. Applications close 7 May 2010. [More details](http://www.cs.ox.ac.uk/news/185-full.html).

- date: 2010-03
  text: >-
    Two fully funded PhD studentships are now available at Oxford on the forthcoming
    [VERIWARE](http://www.veriware.org/) project. Applications close 4 May 2010.
    [More details](http://www.cs.ox.ac.uk/news/183-full.html).

- date: 2010-02
  text: >-
    There will be a PRISM [session](/courses/qmc10/) at this month's PhD school on
    [Quantitative Model Checking](http://www.artist-embedded.org/artist/Overview,2048.html) (QMC), organised by
    ArtistDesign/MT-LAB.

- date: 2009-05
  text: >-
    A beta release of PRISM version 3.3 is now [available](/download/). New features include LTL model checking,
    better error reporting, an extended property language and
    [much more](https://github.com/prismmodelchecker/prism/blob/master/CHANGELOG.txt).

- date: 2008-12
  text: >-
    A new [development version](https://github.com/prismmodelchecker/prism) of PRISM is now available, with many
    new features and improvements. [Full details](https://github.com/prismmodelchecker/prism).

- date: 2008-11
  text: >-
    Two research positions are now available at Oxford, working on the CONNECT-IP project: one Research Assistant
    (Grade 7) and one Student Researcher. Applications close 5 January 2009. Details:
    [Research Assistant](http://www.cs.ox.ac.uk/news/documents/connect7-fps.pdf) and
    [Student Researcher](http://www.cs.ox.ac.uk/news/documents/connect6-fps.pdf).

- date: 2008-04
  text: >-
    A fully funded [PhD studentship](http://www.cs.ox.ac.uk/news/21-full.html) is now available at Oxford on the
    forthcoming [Predictable Software Systems](http://qav.cs.ox.ac.uk/projects/epsrc-pss/) project. Applications
    close 16 May 2008. [More details](http://www.cs.ox.ac.uk/news/21-full.html).

- date: 2008-03
  text: >-
    PRISM has now been [downloaded](/download/) more than 10,000 times. Thanks for your support.

- date: 2008-02
  text: >-
    A beta version of the next PRISM release (version 3.2) is now [available](/download/). [Details](/download/).

- date: 2007-11
  text: >-
    A fully funded [PhD studentship](http://www.cs.ox.ac.uk/oucl/prospective/dphil/MartaStudentship.pdf) is now
    available at Oxford on the forthcoming
    [Predictable Software Systems](http://qav.cs.ox.ac.uk/projects/epsrc-pss/) project. Applications close 18
    January. [More details](http://www.cs.ox.ac.uk/oucl/prospective/dphil/MartaStudentship.pdf).

- date: 2007-10
  text: >-
    A new [development version](https://github.com/prismmodelchecker/prism) of PRISM is now available. Changes
    since the last development release include a new graph plotting engine, improvements to labels/formula, and a
    (slight) redesign to match the new web site.

- date: 2007-09
  text: >-
    A [postdoctoral position](http://www.cs.ox.ac.uk/oucl/jobs/pss7-07.html) is now available at Oxford on the
    forthcoming Predictable Software Systems project. Applications close 18 October.
    [More details](http://www.cs.ox.ac.uk/oucl/jobs/pss7-07.html).

- date: 2007-07
  text: >-
    The PRISM team have moved to [Oxford University](http://www.cs.ox.ac.uk/). Concurrently, we have re-launched
    the PRISM web site, with a new design and a new [URL](/).

- date: 2007-06
  text: >-
    New [development versions](https://github.com/prismmodelchecker/prism) of PRISM are now being made available
    again. Recent new functionality includes: an SBML-to-PRISM translator, support for 64-bit architectures and an
    improved simulator GUI.

- date: 2007-05
  text: >-
    A new [FAQ](/manual/FrequentlyAskedQuestions/) section has been added to the PRISM manual. Comments or
    requests for topics to be covered are welcome.

- date: 2007-05
  text: >-
    A new symmetry reduction tool for PRISM called [GRIP](https://github.com/afd/symmetrytools/tree/master/GRIP),
    developed at the University of Glasgow, is now available.

- date: 2007-04
  text: >-
    The PRISM web site now includes slides for an 11-part [lecture course](/lectures/) introducing probabilistic
    model checking and PRISM. This material formed the basis of the recent 15-hour course given at the
    [BISS 2007](http://www.cs.unibo.it/ricerca/grad/biss2007/) school.

- date: 2007-04
  text: >-
    Version 3.1.1 of PRISM has now been [released](/download/), including a few small but important bug fixes
    ([precise details](https://github.com/prismmodelchecker/prism/blob/master/CHANGELOG.txt)).

- date: 2006-11
  text: >-
    A beta release of version 3.1 of PRISM is now [ available](/download/). New features include a Windows
    installer, multiple reward structures and command-line generation of random paths
    ([more details](https://github.com/prismmodelchecker/prism/blob/master/CHANGELOG.txt)).

- date: 2006-10
  text: >-
    New and up-to-date material for those wishing to learn about PRISM is now available, to coincide with the
    [VPSM](http://first.dk/VPSM) PhD school in Copenhagen this month. An online tutorial is now
    [available](/tutorial/). There are also up-to-date slides. These are in three parts: (I)
    [probabilistic model checking for DTMCs/MDPs/PTAs](/talks/vpsm06-part1.pdf), (II)
    [PRISM](/talks/vpsm06-part2.pdf) and (III) [case studies](/talks/vpsm06-part3.pdf).

- date: 2006-07
  text: >-
    The PRISM manual is now [online](/manual/), making it considerably easier to navigate and search. This will
    also allow us to update and improve the manual more efficiently. This launch coincides with the full
    [release](/download/) of version 3.0 of PRISM, which was previously available as a beta release.

- date: 2006-06
  text: >-
    Applications are invited for a Research Associate to work on the new EPSRC funded project
    [Automated quantitative software verification with PRISM](http://www.cs.bham.ac.uk/~mzk/research/projects/swverif/),
    whose aim is to extend the PRISM tool with the capability to extract models from software.
    [Details of the post](http://www.personnel.bham.ac.uk/vacancies/furtherParticulars.htm?refNo=43042) are
    available. Informal enquires can be emailed to [Marta Kwiatkowska](mailto:mzk@cs.bham.ac.uk).

- date: 2006-03
  text: >-
    Version 3.0.beta1 of PRISM is [now available](/download/). This major new release includes a simulator
    (providing approximate verification techniques and a model debugging tool), costs and rewards, support for Mac
    OS X, improved import/export functionality and
    [much more](https://github.com/prismmodelchecker/prism/blob/master/CHANGELOG.txt).

- date: 2006-03
  text: >-
    A [tool paper](/bibitem/HKNP06/) and demo of the forthcoming new release of PRISM will be presented at the
    [TACAS'06](http://depend.cs.uni-sb.de/index.php?id=329) conference in Vienna this month.

- date: 2006-03
  text: >-
    There will be a tutorial on probabilistic model checking and PRISM at the
    [Verification of Protocols for Security and Mobility (VPSM)](http://first.dk/VPSM) PhD School to be held in
    Copenhagen in October.

- date: 2006-01
  text: >-
    We are in the process of migrating "[support](/support/)" aspects of the PRISM project to SourceForge. See the
    [project page](http://sourceforge.net/projects/prism-mc/). Please help out by posting queries in the
    [help forum](http://sourceforge.net/forum/forum.php?forum_id=520372) or filing a
    [bug report](http://sourceforge.net/tracker/?func=add&group_id=155178&atid=794764).

- date: 2005-10
  text: >-
    PRISM now runs on Mac OS X, as well as on Linux, Solaris and Windows. To try it out, download a
    [development version](https://github.com/prismmodelchecker/prism) of PRISM.

- date: 2005-06
  text: >-
    A PhD studentship is now available in the School of Computer Science at the University of Birmingham to work
    on probabilistic model checking and PRISM. See
    [the studentship](http://www.cs.bham.ac.uk/~mzk/research_probmc_stud.html) and
    [other funded PhD opportunities](http://www.cs.bham.ac.uk/study/postgraduate-research/special_opportunities.html)
    for more information.

- date: 2005-01
  text: >-
    Recent development versions of PRISM are now being made available
    [for download](https://github.com/prismmodelchecker/prism). These versions add various new features, including
    support for analysis of models which include information about costs and rewards.

- date: 2004-09
  text: >-
    PRISM now runs on Windows, as well as on Linux and Solaris. This new functionality is available in version
    2.1, the current release of PRISM, which can be [downloaded](/download/).

- date: 2004-04
  text: >-
    The book Mathematical Techniques for Analyzing Concurrent and Probabilistic Systems has now been published by
    [AMS](http://www.ams.org/bookstore?fn=20&arg1=crmmseries&item=CRMM-23). This includes six chapters of lecture
    notes covering the background of probabilistic model checking and the PRISM tool.
    [More information](/bibitem/KNP04a/).

- date: 2004-03
  text: >-
    Version 2.0 of PRISM is now [available](/download/). The new release includes significant improvements to the
    PRISM modelling language and a completely new graphical user interface. See
    [more precise details](https://github.com/prismmodelchecker/prism/blob/master/CHANGELOG.txt) of what is
    included. [Download PRISM 2.0](/download/).

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 615 325" width="615" height="325" role="img"><title>The power management system: a request generator, a service queue and a service provider, which the power manager observes and sends commands to</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 1 L10 5 L0 9 z" fill="#1d1d27"/></marker></defs><rect x="250" y="15" width="250" height="50" rx="8" fill="#dfe8fb" stroke="#2f2ca8" stroke-width="2"/><text x="375" y="40" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1d1d27">Power Manager (PM)</text><rect x="175" y="110" width="425" height="200" rx="10" fill="#fbe6e2" stroke="#9b2c1f" stroke-width="2"/><path d="M205 190 H285 V220 H205" fill="none" stroke="#1d1d27" stroke-width="2"/><line x1="250" y1="190" x2="250" y2="220" stroke="#1d1d27" stroke-width="2"/><line x1="263" y1="190" x2="263" y2="220" stroke="#1d1d27" stroke-width="2"/><line x1="276" y1="190" x2="276" y2="220" stroke="#1d1d27" stroke-width="2"/><text x="245" y="252" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1d1d27">Service Queue</text><text x="245" y="269" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1d1d27">(SRQ)</text><rect x="345" y="140" width="230" height="145" rx="8" fill="#fff6bf" stroke="#3b3b1f" stroke-width="2"/><path d="M455.4 171.6 L429.6 208.4" fill="none" stroke="#1d1d27" stroke-width="2" marker-end="url(#a)"/><path d="M433.0 215.0 L487.0 215.0" fill="none" stroke="#1d1d27" stroke-width="2" marker-end="url(#a)"/><path d="M490.4 208.4 L464.6 171.6" fill="none" stroke="#1d1d27" stroke-width="2" marker-end="url(#a)"/><circle cx="460" cy="165" r="7" fill="#fff" stroke="#3b3b